<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Login - EduReserve</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-4">
            <h2 class="text-center">Iniciar Sesión</h2>
            <div th:if="${param.error}" class="alert alert-danger">Email o contraseña incorrectos.</div>
            <div th:if="${param.logout}" class="alert alert-success">Has cerrado sesión.</div>
            
            <form th:action="@{/login}" method="post">
                <div class="mb-3">
                    <label>Email:</label>
                    <input type="email" name="username" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label>Contraseña:</label>
                    <input type="password" name="password" class="form-control" required>
                </div>
                <button type="submit" class="btn btn-primary w-100">Entrar</button>
            </form>
            <p class="mt-3 text-center">¿No tienes cuenta? <a th:href="@{/docentes/registro}">Regístrate aquí</a></p>
        </div>
    </div>
</body>
</html>

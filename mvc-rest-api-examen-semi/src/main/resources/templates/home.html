<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <title>Panel de Control - EduReserve</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container mt-5">
    <div class="d-flex justify-content-between">
        <h2>Bienvenido, <span sec:authentication="name">Usuario</span></h2>
        <form th:action="@{/logout}" method="post">
            <button type="submit" class="btn btn-outline-danger">Cerrar Sesión</button>
        </form>
    </div>
    <hr>
    <div class="row mt-4">
        <div class="col-md-6">
            <div class="card">
                <div class="card-body">
                    <h5 class="card-title">Mis Reservas</h5>
                    <p>Gestiona tus aulas reservadas y consulta horarios.</p>
                    <a th:href="@{/reservas}" class="btn btn-primary">Ver Reservas</a>
                </div>
            </div>
        </div>
    </div>
</body>
</html>

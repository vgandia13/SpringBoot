<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Mis Reservas - EduReserve</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container mt-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Mis Reservas 📅</h2>
        <a th:href="@{/home}" class="btn btn-secondary">Volver al Home</a>
    </div>

    <div class="card mb-4">
        <div class="card-body">
            <form th:action="@{/reservas}" method="get" class="row g-3 align-items-center">
                <div class="col-auto">
                    <label class="col-form-label">Ver reservas anteriores a:</label>
                </div>
                <div class="col-auto">
                    <input type="datetime-local" name="fecha" class="form-control">
                </div>
                <div class="col-auto">
                    <button type="submit" class="btn btn-primary">Filtrar</button>
                    <a th:href="@{/reservas}" class="btn btn-outline-secondary">Limpiar</a>
                </div>
            </form>
        </div>
    </div>

    <div class="table-responsive">
        <table class="table table-striped table-hover">
            <thead class="table-dark">
                <tr>
                    <th>ID</th>
                    <th>Aula (Código)</th>
                    <th>Inicio</th>
                    <th>Fin</th>
                    <th>Fecha Creación</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="reserva : ${reservas}">
                    <td th:text="${reserva.id}"></td>
                    <td th:text="${reserva.aulaCodigo}"></td>
                    <td th:text="${#temporals.format(reserva.fechaInicio, 'dd/MM/yyyy HH:mm')}"></td>
                    <td th:text="${#temporals.format(reserva.fechaFin, 'dd/MM/yyyy HH:mm')}"></td>
                    <td th:text="${#temporals.format(reserva.fechaReserva, 'dd/MM/yyyy HH:mm')}"></td>
                </tr>
                <tr th:if="${#lists.isEmpty(reservas)}">
                    <td colspan="5" class="text-center text-muted">No se han encontrado reservas.</td>
                </tr>
            </tbody>
        </table>
    </div>
</body>
</html>

spring.application.name=gestion-tareas-api

# 1. Configuración de MySQL 
# Asegúrate de que el nombre 'gestion_tareas_api' coincida con la BD que crees en phpMyAdmin
spring.datasource.url=jdbc:mysql://localhost:3306/gestion_tareas_api
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# 2. Configuración de JPA y Hibernate 
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true